plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.ksp)
    alias(libs.plugins.kover)
}

android {
    compileSdk = libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.targetSdk.get().toInteger()
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = libs.versions.javaVersion.get()
        targetCompatibility = libs.versions.javaVersion.get()
    }
    // AGP 9's built-in Kotlin defaults jvmTarget to compileOptions.targetCompatibility.
    namespace 'org.tvheadend.data'

    buildFeatures {
        buildConfig = true
    }

    // Robolectric needs the merged Android resources/manifest of this module so the
    // Room in-memory tests can resolve the generated database and DAO classes.
    testOptions.unitTests.includeAndroidResources = true
}

ksp {
    // Room schema location and incremental processing, previously set through
    // javaCompileOptions.annotationProcessorOptions (kapt).
    arg('room.schemaLocation', "$projectDir/schemas")
    arg('room.incremental', 'true')
}

dependencies {
    // Support library basics
    implementation libs.androidx.appcompat
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.lifecycle.livedata.ktx

    // Android Room
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler

    // Logging library
    implementation libs.timber

    // Coroutines: the data sources read the database on Dispatchers.IO via withContext.
    implementation libs.kotlinx.coroutines.android

    // ----------------------------------------------------------------------------
    // Unit (JVM) testing. Robolectric supplies real implementations of the Android
    // framework classes so the Room in-memory tests can run on the JVM.
    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
    testImplementation libs.androidx.test.ext.junit
    testImplementation libs.androidx.arch.core.testing
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.androidx.room.testing
    testImplementation libs.truth
}
