plugins {
    id 'com.android.library'
    id 'com.google.devtools.ksp'
}

android {
    compileSdk = libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.targetSdk.get().toInteger()
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            initWith buildTypes.release
        }
    }
    compileOptions {
        sourceCompatibility = libs.versions.javaVersion.get()
        targetCompatibility = libs.versions.javaVersion.get()
    }
    // AGP 9's built-in Kotlin defaults jvmTarget to compileOptions.targetCompatibility.
    namespace 'org.tvheadend.data'

    buildFeatures {
        buildConfig = true
    }
}

ksp {
    // Room schema location and incremental processing, previously set through
    // javaCompileOptions.annotationProcessorOptions (kapt).
    arg('room.schemaLocation', "$projectDir/schemas")
    arg('room.incremental', 'true')
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Support library basics
    implementation libs.androidx.appcompat
    implementation libs.androidx.preference.ktx

    // Android Room
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler

    // Logging library
    implementation libs.timber

    // Dependency injection
    implementation libs.dagger.runtime
    ksp libs.dagger.compiler
}
