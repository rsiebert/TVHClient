plugins {
    id 'com.android.library'
    id 'com.google.devtools.ksp'
}

android {
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            initWith buildTypes.release
        }
    }
    compileOptions {
        sourceCompatibility = rootProject.ext.javaCompatibility
        targetCompatibility = rootProject.ext.javaCompatibility
    }
    // AGP 9's built-in Kotlin defaults jvmTarget to compileOptions.targetCompatibility.
    namespace 'org.tvheadend.data'

    buildFeatures {
        buildConfig = true
    }
}

ksp {
    // Room schema location and incremental processing, previously set through
    // javaCompileOptions.annotationProcessorOptions (kapt).
    arg('room.schemaLocation', "$projectDir/schemas")
    arg('room.incremental', 'true')
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Support library basics
    implementation "androidx.appcompat:appcompat:$appCompatVersion"
    implementation "androidx.preference:preference-ktx:$prefKtxVersion"

    // Android Room
    def roomVersion = '2.8.5'
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"

    // Logging library
    implementation "com.jakewharton.timber:timber:$timberVersion"

    // Dependency injection
    implementation "com.google.dagger:dagger:$daggerVersion"
    ksp "com.google.dagger:dagger-compiler:$daggerVersion"
}
