plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

android {
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [
                        "room.schemaLocation": "$projectDir/schemas".toString(),
                        "room.incremental"   : "true"
                ]
            }
        }
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            initWith buildTypes.release
        }
    }
    compileOptions {
        sourceCompatibility = rootProject.ext.javaCompatibility
        targetCompatibility = rootProject.ext.javaCompatibility
    }
    kotlinOptions.jvmTarget = rootProject.ext.javaCompatibility.toString()
    namespace 'org.tvheadend.data'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Support library basics
    implementation "androidx.appcompat:appcompat:$appCompatVersion"
    implementation "androidx.preference:preference-ktx:$prefKtxVersion"

    // Android Room
    def roomVersion = '2.8.5'
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    kapt "androidx.room:room-compiler:$roomVersion"
    // Room 2.8.x ships kotlin-metadata-jvm 2.2.0, but Kotlin 2.4 emits 2.4.0 metadata.
    // Pin the parser on the annotation-processor classpath. Step 2 (KSP) removes the
    // need for this: KSP reads symbols instead of compiled metadata.
    kapt "org.jetbrains.kotlin:kotlin-metadata-jvm:$kotlinVersion"

    // Logging library
    implementation "com.jakewharton.timber:timber:$timberVersion"

    // Dependency injection
    implementation "com.google.dagger:dagger:$daggerVersion"
    kapt "com.google.dagger:dagger-compiler:$daggerVersion"
}
