plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.parcelize)
    alias(libs.plugins.kover)
}

android {
    compileSdk = libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.targetSdk.get().toInteger()
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = libs.versions.javaVersion.get()
        targetCompatibility = libs.versions.javaVersion.get()
    }
    // AGP 9's built-in Kotlin defaults jvmTarget to compileOptions.targetCompatibility.
    namespace 'org.tvheadend.htsp'

    buildFeatures {
        buildConfig = true
    }

    // Enable test fixtures so the reusable FakeHtspServer can be shared between
    // this module's JVM tests and the app module's instrumented (androidTest) tests.
    testFixtures {
        enable = true
    }

    // Robolectric needs the merged Android resources/manifest of this module.
    testOptions.unitTests.includeAndroidResources = true
}

dependencies {
    // The Java sources (HtspConnection, HtspFileInputStream) use @NonNull/@Nullable.
    implementation libs.androidx.annotation
    implementation libs.timber

    // HtspConnection is a plain thread/selector implementation, but it relies on
    // android.net.Uri and android.util.SparseArray. Robolectric provides real
    // implementations of those framework classes so the connection can be
    // exercised on the JVM against the fake server.
    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
    testImplementation libs.truth
}
