# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Kotlin 2.x plus AGP 8.13 need a larger compiler daemon; the previous 512m metaspace OOMs.
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1024m

# Build modules within a project in parallel instead of sequentially. This requires decoupled
# projects, which is the case here: ':app', ':data' and ':htsp' never read each other's project
# state. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# Kept off deliberately. configure-on-demand is still incubating, interacts poorly with AGP, and
# Gradle now steers users towards isolated projects instead.
#org.gradle.configureondemand=true

# Reuse task outputs (KSP/KSP output, test results, lint, AAPT) across builds and, via the
# 'gradle/actions/setup-gradle' step in CI, across workflow runs.
org.gradle.caching=true

# The configuration cache is deliberately not enabled yet. The configuration-time side effects
# it used to trip on are gone (see the providers.* usage in app/build.gradle and signing.gradle),
# but 'providers.exec' results are stored in the cache entry, so GIT_SHA would be frozen until
# an unrelated input changes. Decide how to source the SHA before turning this on.
#org.gradle.configuration-cache=true

android.useAndroidX=true
# Jetifier is not needed any more: every dependency is an AndroidX artifact.

#android.debug.obsoleteApi=true

# kapt is still required by Data Binding in the app module
kapt.incremental.apt=true
kapt.include.compile.classpath=false
android.nonTransitiveRClass=true
# android.nonFinalResIds stays at its default (true) so R8's optimized resource
# shrinking can run; final R class ids are not supported by it.
