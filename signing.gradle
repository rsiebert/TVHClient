// Read through `providers` so the file is a tracked input to the configuration phase rather
// than an undeclared stream read, and so no file handle is left open.
def keystoreProperties = new Properties()
keystoreProperties.load(new StringReader(
        providers.fileContents(rootProject.layout.projectDirectory.file("keystore.properties")).asText.get()))

android {
    signingConfigs {
        release {
            storeFile file(keystoreProperties['releaseKeystoreFile'])
            storePassword keystoreProperties['releaseKeystorePassword']
            keyAlias keystoreProperties['releaseKeyAlias']
            keyPassword keystoreProperties['releaseKeyPassword']
        }
        debug {
            storeFile file(keystoreProperties['debugKeystoreFile'])
            storePassword keystoreProperties['debugKeystorePassword']
            keyAlias keystoreProperties['debugKeyAlias']
            keyPassword keystoreProperties['debugKeyPassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }
}