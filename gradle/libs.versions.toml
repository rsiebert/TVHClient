# Single source of truth for SDK levels, library versions and Gradle plugin versions.
#
# Plugin versions are consumed through the [plugins] aliases below, which the modules apply with
# `alias(libs.plugins.…)`. The root build file no longer keeps a buildscript classpath.

[versions]
compileSdk = "37"
minSdk = "24"
targetSdk = "36"
javaVersion = "17"

# Gradle plugins, applied through the [plugins] aliases at the bottom of this file.
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.13"
kover = "0.9.11"
google-services = "4.6.0"
crashlytics-gradle = "3.0.8"
perf-gradle = "2.0.2"

# AndroidX
appcompat = "1.8.0"
coreKtx = "1.19.1"
preferenceKtx = "1.2.1"
recyclerview = "1.4.0"
annotation = "1.11.0"
constraintlayout = "2.2.2"
viewpager2 = "1.1.0"
work = "2.12.0"
mediarouter = "1.8.1"
localbroadcastmanager = "1.1.0"
lifecycle = "2.11.0"
fragment = "1.9.1"
material = "1.14.0"
room = "2.8.5"
androidxTest = "1.7.0"

# Tools and languages
timber = "5.0.1"
coil = "3.6.3"
coroutines = "1.11.0"

# Google Play / Cast
billing = "9.1.0"
playServicesCast = "23.0.0"

# Firebase
firebaseCrashlytics = "21.0.1"
firebasePerf = "23.0.1"

media3 = "1.11.1"

junit = "4.13.2"

# Instrumented (androidTest) testing - the coordinated androidx.test release train
# (test core 1.7.0, monitor 1.8.0, runner/rules 1.7.0, espresso 3.7.0).
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
androidxTestMonitor = "1.8.0"
espresso = "3.7.0"

# JVM unit testing - Robolectric supplies real implementations of the Android
# framework classes (Uri, SparseArray, Log) that the htsp module depends on
robolectric = "4.17"

# Additional JVM unit-testing libraries (coroutines, LiveData, mocking, assertions)
coroutinesTest = "1.11.0"
archCoreTesting = "2.2.0"
mockk = "1.14.12"
truth = "1.4.5"
turbine = "1.2.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preferenceKtx" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
androidx-mediarouter = { module = "androidx.mediarouter:mediarouter", version.ref = "mediarouter" }
androidx-localbroadcastmanager = { module = "androidx.localbroadcastmanager:localbroadcastmanager", version.ref = "localbroadcastmanager" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-fragment-testing = { module = "androidx.fragment:fragment-testing", version.ref = "fragment" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }

timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
coil = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

material-components = { module = "com.google.android.material:material", version.ref = "material" }

billing-ktx = { module = "com.android.billingclient:billing-ktx", version.ref = "billing" }
play-services-cast-framework = { module = "com.google.android.gms:play-services-cast-framework", version.ref = "playServicesCast" }

firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics", version.ref = "firebaseCrashlytics" }
firebase-perf = { module = "com.google.firebase:firebase-perf", version.ref = "firebasePerf" }

media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-datasource = { module = "androidx.media3:media3-datasource", version.ref = "media3" }
media3-extractor = { module = "androidx.media3:media3-extractor", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }

androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-monitor = { module = "androidx.test:monitor", version.ref = "androidxTestMonitor" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-arch-core-testing = { module = "androidx.arch.core:core-testing", version.ref = "archCoreTesting" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# AGP 9 no longer permits the kotlin-kapt plugin; the Data Binding module uses this
# AGP-versioned shim instead.
android-legacy-kapt = { id = "com.android.legacy-kapt", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
# Bumped for AGP 9: the previous plugin generation cannot be instantiated under AGP 9.
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlytics-gradle" }
firebase-perf = { id = "com.google.firebase.firebase-perf", version.ref = "perf-gradle" }
# Coverage instrumentation, report-only for now (thresholds land in Phase 6).
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
