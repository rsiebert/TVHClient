# Single source of truth for SDK levels and library versions.
#
# Plugin versions (AGP, Kotlin, KSP, Firebase) live in the root build.gradle buildscript
# block, because a version catalog cannot be read from inside a `buildscript {}` block.

[versions]
compileSdk = "37"
minSdk = "24"
targetSdk = "34"
javaVersion = "17"

# AndroidX
appcompat = "1.8.0"
coreKtx = "1.19.1"
preferenceKtx = "1.2.1"
recyclerview = "1.4.0"
annotation = "1.11.0"
constraintlayout = "2.2.2"
viewpager2 = "1.1.0"
work = "2.12.0"
mediarouter = "1.8.1"
lifecycle = "2.11.0"
fragment = "1.9.1"
material = "1.14.0"
room = "2.8.5"
androidxTest = "1.6.1"

# Tools and languages
timber = "5.0.1"
picasso = "2.71828"
coroutines = "1.11.0"

# Google Play / Cast
billing = "9.1.0"
playServicesCast = "21.0.0"
transportBackendCct = "5.0.0"

# Firebase
firebaseAnalytics = "22.5.0"
firebaseCrashlytics = "21.0.1"
firebasePerf = "23.0.1"

media3 = "1.11.1"

junit = "4.13.2"

# Instrumented (androidTest) testing - versions compatible with compileSdk 34
androidxTestExtJunit = "1.2.1"
androidxTestRunner = "1.6.1"
androidxTestRules = "1.6.1"
androidxTestMonitor = "1.6.1"
espresso = "3.6.1"

# JVM unit testing - Robolectric supplies real implementations of the Android
# framework classes (Uri, SparseArray, Log) that the htsp module depends on
robolectric = "4.17"

# Additional JVM unit-testing libraries (coroutines, LiveData, mocking, assertions)
coroutinesTest = "1.11.0"
archCoreTesting = "2.2.0"
mockk = "1.14.11"
truth = "1.4.5"
turbine = "1.2.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preferenceKtx" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
androidx-mediarouter = { module = "androidx.mediarouter:mediarouter", version.ref = "mediarouter" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-fragment-testing = { module = "androidx.fragment:fragment-testing", version.ref = "fragment" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }

timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
picasso = { module = "com.squareup.picasso:picasso", version.ref = "picasso" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

material-components = { module = "com.google.android.material:material", version.ref = "material" }

billing-client = { module = "com.android.billingclient:billing", version.ref = "billing" }
billing-ktx = { module = "com.android.billingclient:billing-ktx", version.ref = "billing" }
play-services-cast-framework = { module = "com.google.android.gms:play-services-cast-framework", version.ref = "playServicesCast" }
transport-backend-cct = { module = "com.google.android.datatransport:transport-backend-cct", version.ref = "transportBackendCct" }

firebase-analytics-ktx = { module = "com.google.firebase:firebase-analytics-ktx", version.ref = "firebaseAnalytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics", version.ref = "firebaseCrashlytics" }
firebase-perf = { module = "com.google.firebase:firebase-perf", version.ref = "firebasePerf" }

media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-datasource = { module = "androidx.media3:media3-datasource", version.ref = "media3" }
media3-extractor = { module = "androidx.media3:media3-extractor", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }

androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-monitor = { module = "androidx.test:monitor", version.ref = "androidxTestMonitor" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-arch-core-testing = { module = "androidx.arch.core:core-testing", version.ref = "archCoreTesting" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
