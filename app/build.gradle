plugins {
    alias(libs.plugins.android.application)
    // AGP 9 compiles Kotlin itself (built-in Kotlin) and no longer accepts kotlin-android.
    // Data Binding still needs kapt, which AGP 9 only allows through this shim.
    alias(libs.plugins.android.legacy.kapt)
    alias(libs.plugins.ksp)
    alias(libs.plugins.kotlin.parcelize)
    alias(libs.plugins.google.services)
    alias(libs.plugins.firebase.perf)
    alias(libs.plugins.firebase.crashlytics)
    alias(libs.plugins.kover)
}

apply from: '../signing.gradle'

// Read through `providers` rather than a raw stream: the file is then a tracked input to the
// configuration phase instead of an undeclared read, and no file handle is leaked.
//
// The file is gitignored (it holds the developer e-mail and the Cast receiver id), so a fresh
// clone does not have it. Fall back to empty defaults instead of failing configuration, so the
// project still syncs and builds. Copy tvhclient-github.properties to create it.
def tvhclientPropertiesFile = rootProject.layout.projectDirectory.file("tvhclient.properties")
def appProperties = new Properties()
if (tvhclientPropertiesFile.asFile.exists()) {
    appProperties.load(new StringReader(providers.fileContents(tvhclientPropertiesFile).asText.get()))
} else {
    logger.lifecycle("tvhclient.properties is missing; using empty defaults")
}

android {
    compileSdk = libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.targetSdk.get().toInteger()
        versionCode 243
        versionName "3.0.0"

        // Define the apk naming convention
        applicationId "org.tvheadend.tvhclient"

        // Set the default values for these build config fields
        buildConfigField "String", "DEVELOPER_EMAIL", "\"${appProperties.getProperty('developerEmail', '')}\""
        buildConfigField "Integer", "BUILD_VERSION", "$versionCode"

        // The cast ID that the app shall use
        buildConfigField "String", "CAST_ID", "\"${appProperties.getProperty('castId', '')}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        dataBinding = true
        viewBinding true
        buildConfig = true
    }

    lint {
        // Lint runs on release builds too, so a regression cannot slip into a release unnoticed.
        // The pre-existing findings are recorded in the baseline, so only new ones fail the build.
        checkReleaseBuilds true
        // Opt in to Media3's @UnstableApi surface (custom Extractors, DataSource,
        // TrackSelector, AnalyticsListener) so a manual lint run is warning-free.
        lintConfig = file("lint.xml")
        // Record the pre-existing findings so `check` can be used as the gate runner. Anything new
        // is still reported and fails the build.
        baseline = file("lint-baseline.xml")
        // AGP's unit-test lint analysis reads the Data Binding output that kapt generates for the
        // *release* variant without depending on the task that writes it, so on a cold build lint
        // dies with FileNotFoundException on DataBinderMapperImpl.java and fails. Skipping test
        // sources keeps the analysis deterministic.
        checkTestSources = false
    }

    compileOptions {
        sourceCompatibility = libs.versions.javaVersion.get()
        targetCompatibility = libs.versions.javaVersion.get()
    }

    // AGP 9's built-in Kotlin defaults jvmTarget to compileOptions.targetCompatibility.
    testOptions.unitTests.includeAndroidResources = true
    namespace 'org.tvheadend.tvhclient'

    buildTypes {
        release {
            // Reduce the apk file size by enabling proguard
            // AGP 9 removed 'proguard-android.txt' (it embedded -dontoptimize). Note this
            // means release builds now run R8 optimisations.
            // AGP 9.3+ turns on code shrinking, resource shrinking and
            // proguard-android-optimize.txt in one setting.
            optimization {
                enable = true
            }
            proguardFiles 'proguard-rules.pro'
            buildConfigField "Boolean", "OVERRIDE_UNLOCKED", "false"
        }
        debug {
            // Deliberately no initWith here. initWith copies the whole release build type, and
            // that silently drags in debuggable = false - which left the debug variant
            // undebuggable (no debugger attach, BuildConfig.DEBUG == false). Everything that
            // genuinely needs to differ is set explicitly below, so the debug build type keeps
            // AGP's defaults (debuggable = true).
            optimization {
                enable = false
            }
            // Firebase Performance rewrites bytecode to add trace methods on every build. That
            // cost is only worth paying for release artefacts, and the plugin takes the switch
            // per variant.
            FirebasePerformance {
                instrumentationEnabled false
            }
            // Debug is never minified, so there is no mapping file worth uploading.
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
            // Debug builds are unlocked so the paid-only features (the internal player, the
            // recording profiles) can be exercised without a Play purchase.
            buildConfigField "Boolean", "OVERRIDE_UNLOCKED", "true"
        }
    }
}

// Gradle 9 removed the 'archivesBaseName' convention property, so it can no longer be set
// from defaultConfig via setProperty(...). Set the APK naming convention via the base extension.
base {
    archivesName = "${android.defaultConfig.applicationId}-${android.defaultConfig.versionName}-${android.defaultConfig.versionCode}"
}

dependencies {
    // AndroidX libraries
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.recyclerview
    implementation libs.androidx.annotation
    // Used for app-internal broadcasts; previously supplied transitively by firebase-analytics.
    implementation libs.androidx.localbroadcastmanager
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.viewpager2
    implementation libs.androidx.work.runtime
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.fragment.ktx
    debugImplementation libs.androidx.fragment.testing
    // androidx.fragment:fragment-testing requests an old androidx.test stack that ends up in
    // the debug APK and shadows the one used by the Espresso runner (missing
    // androidx.test.platform.io.FileTestStorage and the API-34 registerReceiver flags).
    // Keep the debug variant aligned with the versions used by the androidTest APK.
    debugImplementation libs.androidx.test.core
    debugImplementation libs.androidx.test.monitor
    debugImplementation libs.androidx.test.rules

    // Misc stuff like logging, image loading, billing, casting
    implementation libs.material.components
    implementation libs.timber
    implementation libs.coil
    implementation libs.coil.network.okhttp
    implementation libs.billing.ktx
    implementation libs.play.services.cast.framework
    implementation libs.androidx.mediarouter

    // Kotlin
    implementation libs.kotlinx.coroutines.android

    // Firebase Crash Reporting and Performance Monitoring
    implementation libs.firebase.crashlytics
    implementation libs.firebase.perf

    // ----------------------------------------------------------------------------
    // Required internal libraries for the application

    implementation libs.media3.exoplayer
    implementation libs.media3.ui
    implementation libs.media3.datasource
    implementation libs.media3.extractor
    implementation libs.media3.common
    implementation libs.media3.session
    implementation libs.media3.cast

    implementation project(':htsp')
    implementation project(':data')

    // ----------------------------------------------------------------------------
    // Required dependencies for unit testing
    testImplementation libs.junit
    testImplementation libs.androidx.test.core
    testImplementation libs.androidx.test.ext.junit
    testImplementation libs.robolectric
    testImplementation libs.androidx.arch.core.testing
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.mockk
    testImplementation libs.truth
    testImplementation libs.turbine
    // The ViewModel tests build a real AppRepository over an in-memory AppRoomDatabase.
    // :data declares room-runtime as `implementation`, so it is not on :app's classpath.
    testImplementation libs.androidx.room.runtime
    // Reuse the htsp test fixtures (FakeHtspServer, HtspSampleData) in JVM tests,
    // not only in the androidTest source set.
    testImplementation testFixtures(project(':htsp'))

    // ----------------------------------------------------------------------------
    // Required dependencies for instrumented (androidTest) testing
    androidTestImplementation libs.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.androidx.test.monitor
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.espresso.core

    // The reusable FakeHtspServer lives in the htsp module's test fixtures so the
    // Espresso test can run it in-process. Expose the htsp test fixtures and the
    // htsp main classes (HtspMessage, HtspConnection) to the androidTest source set.
    androidTestImplementation testFixtures(project(':htsp'))
    androidTestImplementation project(':htsp')
}

// ---------------------------------------------------------------------------------------------
// Build metadata (git commit, build time)
// ---------------------------------------------------------------------------------------------
// Generated at *execution* time instead of read at configuration time: the configuration cache
// stores configuration-time values, so a `providers.exec` read here would be frozen until an
// unrelated input changed. -PgitSha / -PbuildTime override the generated values (e.g. from CI,
// where .git may not be present).
abstract class GenerateBuildInfoTask extends DefaultTask {

    @Input
    @Optional
    abstract Property<String> getGitShaOverride()

    @Input
    @Optional
    abstract Property<String> getBuildTimeOverride()

    @Input
    abstract Property<Boolean> getReleaseBuild()

    @Internal
    abstract Property<String> getWorkingDirectory()

    @InputFile
    @Optional
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getGitHead()

    @InputDirectory
    @Optional
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getGitRefs()

    @InputFile
    @Optional
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getGitPackedRefs()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @javax.inject.Inject
    abstract org.gradle.process.ExecOperations getExecOperations()

    @TaskAction
    void generate() {
        String sha = gitShaOverride.getOrNull()
        if (sha == null) {
            def output = new ByteArrayOutputStream()
            execOperations.exec {
                commandLine 'git', 'rev-parse', '--short', 'HEAD'
                workingDir workingDirectory.get()
                ignoreExitValue true
                standardOutput = output
            }
            def text = output.toString().trim()
            sha = text.isEmpty() ? 'unknown' : text
        }
        String time = buildTimeOverride.getOrNull() ?: (releaseBuild.getOrElse(false)
                ? new Date().format('yyyy.MM.dd HH:mm:ss') : 'dev')

        def valuesDir = new File(outputDirectory.get().asFile, 'values')
        valuesDir.mkdirs()
        new File(valuesDir, 'build_info.xml').text = """<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="build_git_sha" translatable="false">${sha}</string>
    <string name="build_time" translatable="false">${time}</string>
</resources>
"""
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def generateBuildInfo = tasks.register("generate${variant.name}BuildInfo", GenerateBuildInfoTask) { task ->
            task.gitShaOverride.set(providers.gradleProperty('gitSha'))
            task.buildTimeOverride.set(providers.gradleProperty('buildTime'))
            task.releaseBuild.set(variant.buildType == 'release')
            task.workingDirectory.set(rootDir.absolutePath)
            task.gitHead.set(rootProject.layout.projectDirectory.file('.git/HEAD'))
            task.gitRefs.set(rootProject.layout.projectDirectory.dir('.git/refs'))
            task.gitPackedRefs.set(rootProject.layout.projectDirectory.file('.git/packed-refs'))
        }
        variant.sources.res?.addGeneratedSourceDirectory(generateBuildInfo, { it.outputDirectory })
    }
}

