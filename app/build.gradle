plugins {
    id 'com.android.application'
    // AGP 9 compiles Kotlin itself (built-in Kotlin) and no longer accepts kotlin-android.
    // Data Binding still needs kapt, which AGP 9 only allows through this shim.
    id 'com.android.legacy-kapt'
    id 'com.google.devtools.ksp'
    id 'kotlin-parcelize'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.firebase-perf'
    id 'com.google.firebase.crashlytics'
}

apply from: '../signing.gradle'

def appProperties = new Properties()
appProperties.load(new FileInputStream(rootProject.file("tvhclient.properties")))

android {
    compileSdk = libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.targetSdk.get().toInteger()
        versionCode 241
        versionName "2.4.8"

        // Define the apk naming convention
        applicationId "org.tvheadend.tvhclient"

        // Set the default values for these build config fields
        buildConfigField "String", "DEVELOPER_EMAIL", "\"${appProperties['developerEmail']}\""
        buildConfigField "Integer", "BUILD_VERSION", "$versionCode"

        // Include the build time and git commit hash in the crash reports
        def gitSha = 'git rev-parse --short HEAD'.execute([], project.rootDir).text.trim()
        def buildTime = new GregorianCalendar().format("yyyy.MM.dd HH:mm:ss")
        buildConfigField "String", "BUILD_TIME", "\"${buildTime}\""
        buildConfigField "String", "GIT_SHA", "\"${gitSha}\""

        // The cast ID that the app shall use
        buildConfigField "String", "CAST_ID", "\"${appProperties['castId']}\""

        // Support vector drawable and animated vector drawable on devices
        // running platform versions lower than Android 5.0 (API level 21)
        vectorDrawables.useSupportLibrary = true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        dataBinding = true
        viewBinding true
        buildConfig = true
    }

    lint {
        // Do not check for lint errors to reduce the build time.
        // Lint checks will be done manually before a release
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility = libs.versions.javaVersion.get()
        targetCompatibility = libs.versions.javaVersion.get()
    }

    // AGP 9's built-in Kotlin defaults jvmTarget to compileOptions.targetCompatibility.
    testOptions.unitTests.includeAndroidResources = true
    namespace 'org.tvheadend.tvhclient'
    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    buildTypes {
        release {
            // Reduce the apk file size by enabling proguard
            // AGP 9 removed 'proguard-android.txt' (it embedded -dontoptimize). Note this
            // means release builds now run R8 optimisations.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "Boolean", "OVERRIDE_UNLOCKED", "false"
        }
        debug {
            initWith buildTypes.release
        }
    }
}

// Gradle 9 removed the 'archivesBaseName' convention property, so it can no longer be set
// from defaultConfig via setProperty(...). Set the APK naming convention via the base extension.
base {
    archivesName = "${android.defaultConfig.applicationId}-${android.defaultConfig.versionName}-${android.defaultConfig.versionCode}"
}

dependencies {
    // Dependency on local binaries
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // AndroidX libraries
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.recyclerview
    implementation libs.androidx.annotation
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.viewpager2
    implementation libs.androidx.work.runtime
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.fragment.ktx
    debugImplementation libs.androidx.fragment.testing

    // Misc stuff like logging, image loading, billing, casting
    implementation libs.material.components
    implementation libs.timber
    implementation libs.picasso
    implementation libs.billing.ktx
    implementation libs.billing.client
    implementation libs.play.services.cast.framework
    implementation libs.transport.backend.cct
    implementation libs.androidx.mediarouter

    // Kotlin
    implementation libs.kotlinx.coroutines.android

    // Material navigation drawer and dialogs
    implementation libs.material.dialogs.core
    implementation libs.material.dialogs.input
    implementation libs.material.dialogs.files
    implementation libs.material.dialogs.datetime
    implementation libs.material.dialogs.lifecycle
    //noinspection GradleDependency
    implementation(libs.materialdrawer) {
        // MaterialDrawer 7 requests kotlin-android-extensions-runtime 1.3.61, which bundles
        // kotlinx.android.parcel.* - meanwhile provided by kotlin-parcelize-runtime, giving
        // duplicate classes. The app no longer uses any kotlinx.android API.
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-android-extensions-runtime'
    }

    // Firebase Crash Reporting and Performance Monitoring
    implementation libs.firebase.analytics.ktx
    implementation libs.firebase.crashlytics
    implementation libs.firebase.perf

    // Dependency injection
    implementation libs.dagger.runtime
    ksp libs.dagger.compiler

    // ----------------------------------------------------------------------------
    // Required internal libraries for the application

    implementation libs.exoplayer.ui
    implementation libs.exoplayer.core
    implementation libs.exoplayer.dash
    implementation libs.exoplayer.extension.ffmpeg

    implementation project(':htsp')
    implementation project(':data')

    // ----------------------------------------------------------------------------
    // Required dependencies for unit testing
    testImplementation libs.junit
    testImplementation libs.androidx.test.core
}
