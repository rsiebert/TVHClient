// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        kotlinVersion = '2.4.21'
        kspVersion = '2.3.13'
        compileSdkVersion = 34
        minSdkVersion = 23
        targetSdkVersion = 34
        javaCompatibility = "17"

        timberVersion = '5.0.1'
        appCompatVersion = '1.4.0'
        daggerVersion = '2.60.1'
        coreKtxVersion = "1.7.0"
        prefKtxVersion = "1.1.1"
    }

    repositories {
        google()
        maven { url 'https://plugins.gradle.org/m2/'}
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.1'
        // AGP 9 no longer permits the kotlin-kapt plugin; the Data Binding module uses this
        // AGP-versioned shim instead.
        classpath 'com.android.legacy-kapt:com.android.legacy-kapt.gradle.plugin:9.5.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:$kspVersion"
        // Bumped for AGP 9: the previous plugin generation cannot be instantiated under AGP 9.
        classpath 'com.google.gms:google-services:4.5.0'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.8'
        classpath 'com.google.firebase:perf-plugin:2.0.2'
        //classpath 'com.novoda:bintray-release:0.9.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://plugins.gradle.org/m2/'}
    }
    group = 'org.tvheadend.tvhclient'
}

//apply from: 'javadoc_combined.gradle'

task clean(type: Delete) {
    delete rootProject.buildDir
}
